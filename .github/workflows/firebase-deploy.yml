name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Hosting and Firebase rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          umask 077
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          npx --yes firebase-tools@latest deploy --project samirtalebrealestate-97131 --only hosting,firestore:rules,storage